# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $SRC, $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered

# shellcheck shell=sh
# shellcheck disable=SC2034  # ci/reload.sh reads these after sourcing this file
#
# The probe calls into the loaded library on every reload: this module
# dlopen()s a user library per worker and runs its init on each cycle, so a
# reload that failed to re-load or re-init it would keep answering on the
# port but stop returning the library's greeting.  Building the library and
# loading it every cycle is also the per-reload churn most likely to leak
# here.

mkdir -p "$WORK"
cc -shared -fPIC -I "$SRC/src" -o "$WORK/liblinkfuntest.so" \
	"$SRC/build_test_resources/linkfuntest.c"

RELOAD_HTTP=""

RELOAD_SERVER="
        ngx_link_func_lib \"$WORK/liblinkfuntest.so\";
        location = /greeting {
            ngx_link_func_call \"my_app_simple_get_greeting\";
        }"

RELOAD_EXPECT='greeting from ngx_link_func testing'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/greeting"
}
